<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 底板高质感科技蓝微渐变 -->
    <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 罗盘指针微立体阴影 -->
    <filter id="compassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle 超椭圆圆角底板 -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#navBgGrad)"/>
  <!-- 内部精致高光微边框 -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5"/>

  <!-- 罗盘整体（45度微倾探索姿态） -->
  <g transform="translate(64, 64) rotate(45)">
    <!-- 罗盘刻度外环 -->
    <circle cx="0" cy="0" r="39" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" stroke-dasharray="2 4"/>

    <!-- 四极刻度点 -->
    <circle cx="0" cy="-45" r="2" fill="rgba(255, 255, 255, 0.85)"/>
    <circle cx="45" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.45)"/>
    <circle cx="0" cy="45" r="1.5" fill="rgba(255, 255, 255, 0.45)"/>
    <circle cx="-45" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.45)"/>

    <!-- 指针主体 -->
    <g filter="url(#compassShadow)">
      <!-- 北针（指向右上目标）：高亮立体白面 -->
      <polygon points="0,-35 -8.5,0 0,0" fill="#ffffff"/>
      <polygon points="0,-35 8.5,0 0,0" fill="rgba(255, 255, 255, 0.78)"/>

      <!-- 南针（指向左下原点）：半透深邃对比面 -->
      <polygon points="0,35 -8.5,0 0,0" fill="rgba(255, 255, 255, 0.48)"/>
      <polygon points="0,35 8.5,0 0,0" fill="rgba(255, 255, 255, 0.26)"/>

      <!-- 轴心微圆环与中心高光白点 -->
      <circle cx="0" cy="0" r="6" fill="#1e3a8a"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
